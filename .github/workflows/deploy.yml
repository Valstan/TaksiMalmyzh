name: deploy

# Выкатка на прод-бокс. Только ручной запуск: выкатывать по каждому push в main рано,
# пока не решено открывать стенд наружу — это пересечение границы этапа A→B
# (docs/DEPLOY.md, раздел «Что выкатка меняет юридически»).
#
# Все адреса, порты и пути приходят СЕКРЕТАМИ, не через vars: значения vars
# печатаются в лог прогона, а логи публичного репозитория публичны (письмо brain
# 2026-08-29). По той же причине здесь нет ни одного echo с фактами о сервере и ни
# одного дампа журнала при падении.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        # На боксе сборка не помещается в память, поэтому она здесь (G20).
        run: npm run build

      - name: Релизный пакет
        run: npm run package

      - name: Архив
        run: tar -czf release.tar.gz -C release .

      - name: Ключ доступа
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts

      - name: Доставка пакета
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: scp -P "$SSH_PORT" release.tar.gz "$TARGET:$APP_DIR/incoming.tar.gz"

      - name: Активация релиза
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        # Скрипт активации уходит файлом на stdin, а не сочиняется здесь строкой:
        # текст внутри команды прошёл бы четыре парсера подряд (мандат D-046).
        run: |
          RELEASE="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          ssh -p "$SSH_PORT" "$TARGET" bash -s -- "$APP_DIR" "$RELEASE" "$SERVICE" < deploy/remote-activate.sh

      - name: Смоук
        env:
          SMOKE_URL: ${{ secrets.DEPLOY_SMOKE_URL }}
        # Проверяются три вещи, каждая из которых уже ломалась при постройке:
        # страница, серверный поиск адреса и Range-запрос к карте.
        run: |
          sleep 5
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SMOKE_URL/")
          test "$code" = "200"
          hits=$(curl -sS --max-time 30 "$SMOKE_URL/api/search?q=%D0%9F%D1%80%D0%B8%D0%B1%D1%80%D0%B5%D0%B6%D0%BD%D0%B0%D1%8F" | grep -c '"kind"')
          test "$hits" -ge 1
          range=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -r 0-16 "$SMOKE_URL/map/malmyzh.pmtiles")
          test "$range" = "206"
