name: deploy

# Выкатка на прод-бокс. Только ручной запуск: выкатывать по каждому push в main рано,
# пока не решено открывать стенд наружу — это пересечение границы этапа A→B
# (docs/DEPLOY.md, раздел «Что выкатка меняет юридически»).
#
# Все адреса, порты и пути приходят СЕКРЕТАМИ, не через vars: значения vars
# печатаются в лог прогона, а логи публичного репозитория публичны (письмо brain
# 2026-08-29). По той же причине здесь нет ни одного echo с фактами о сервере и ни
# одного дампа журнала при падении.
#
# ⚠️ И по той же причине у каждого ssh/scp заглушён stderr: маскировка GitHub срабатывает
# на ПОЛНОЕ значение секрета, а DEPLOY_TARGET — это `пользователь@хост`; сам ssh при отказе
# печатает «connect to host <хост> port <порт>», то есть хост и порт отдельными словами, и
# такую строку маскировка не ловит. Диагностика удалённых скриптов идёт в stdout, сюда
# попадает код возврата: 255 — не соединились, иное — сказал сам скрипт.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        # На боксе сборка не помещается в память, поэтому она здесь (G20).
        env:
          # Заглушки, не секреты: рантайм-значения живут в shared/.env на боксе.
          PAYLOAD_SECRET: build-placeholder
          DATABASE_URI: postgres://build:build@127.0.0.1:5432/build
        run: npm run build

      - name: Релизный пакет
        run: npm run package

      - name: Архив
        run: tar -czf release.tar.gz -C release .

      - name: Ключ доступа
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts

      - name: Доставка пакета
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set +e
          scp -P "$SSH_PORT" release.tar.gz "$TARGET:$APP_DIR/incoming.tar.gz" 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" != "0" ]; then
            echo "scp не доставил пакет (код $rc); детали в публичный лог не печатаем"
          fi
          exit "$rc"

      - name: Активация релиза
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          SERVICE: ${{ secrets.DEPLOY_SERVICE }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        # Скрипт активации уходит файлом на stdin, а не сочиняется здесь строкой:
        # текст внутри команды прошёл бы четыре парсера подряд (мандат D-046).
        run: |
          RELEASE="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          set +e
          ssh -p "$SSH_PORT" "$TARGET" bash -s -- "$APP_DIR" "$RELEASE" "$SERVICE"             < deploy/remote-activate.sh 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" = "255" ]; then
            echo "ssh не соединился с боксом (код 255); детали в публичный лог не печатаем"
          fi
          exit "$rc"

      - name: Смоук
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          APP_PORT: ${{ secrets.DEPLOY_APP_PORT }}
          SMOKE_URL: ${{ secrets.DEPLOY_SMOKE_URL }}
        # Обе проверки — с бокса, включая публичную. Раннер GitHub стоит за границей
        # и до этого хоста не достучался: curl отдал таймаут за 30 с, хотя сайт при
        # этом работал. Проверка с раннера была бы вечно красной и научила бы
        # игнорировать красный цвет — а это хуже, чем её отсутствие.
        #
        # DEPLOY_SMOKE_URL может содержать НЕСКОЛЬКО адресов через пробел — по одному
        # на живой домен матрёшки (lib/sites.ts). Разбивает их удалённый шелл: ssh
        # склеивает аргументы в строку, и та разбирается на той стороне (G30). Здесь
        # это ровно то, что нужно — в URL пробелов не бывает, — но подчёркнуто явно,
        # потому что обычно этот слой парсинга и есть источник сюрпризов.
        #
        # Версия MapLibre берётся из package-lock, а не пишется в скрипт: путь к воркеру
        # версионный (docs/DOMAINS.md), и зашитая в двух местах версия однажды разойдётся.
        run: |
          MAPLIBRE=$(node -p "require('./node_modules/maplibre-gl/package.json').version")
          set +e
          ssh -p "$SSH_PORT" "$TARGET" bash -s -- "$APP_PORT" "$MAPLIBRE" "$SMOKE_URL"             < deploy/remote-smoke.sh 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" = "255" ]; then
            echo "ssh не соединился с боксом (код 255); детали в публичный лог не печатаем"
          fi
          exit "$rc"
