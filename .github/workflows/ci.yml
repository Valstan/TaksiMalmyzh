name: ci

# Гейт этапа A и исполнение мандата brain от 2026-08-17: до этой сессии job'а не
# было потому, что не было кода. Имя job для обязательной проверки — `build`.
#
# В логи прогона ничего не печатается сверх вывода самих инструментов: логи
# публичного репозитория публичны, а `vars` в них раскрываются (письмо brain
# 2026-08-29). Здесь нет ни одного `vars`, ни одного `echo` с фактами о среде и
# ни одного дампа журнала.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL нужен одной проверке — сквозной проверке схемы трасс. Она поднимает схему
    # тем же DDL, что уходит миграцией, и прогоняет приём, идемпотентность, шифрование,
    # свёртку и удаление по возрасту. Схема поездок стоит 2× по объёму при ошибке и не
    # переделывается дёшево (M0.A §4.5) — такую вещь нельзя проверять только на прод-базе.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Проверка типов
        run: npm run typecheck

      - name: Сборка
        env:
          # Заглушки, не секреты: payload.config исполняется при next build,
          # но к базе на сборке никто не подключается.
          PAYLOAD_SECRET: build-placeholder
          DATABASE_URI: postgres://build:build@127.0.0.1:5432/build
        run: npm run build

      - name: Карта и справочник на месте
        # Сборка проходит и без них — страница просто окажется пустой у
        # пользователя. Поэтому наличие артефактов проверяется отдельно.
        run: node scripts/check-assets.mjs

      - name: Схема трасс на живом PostgreSQL
        env:
          DATABASE_URI: postgres://postgres:ci@127.0.0.1:5432/ci
        run: npm run check:track

      - name: Политика записи точек
        # Единственное место в клиенте, которое определяет разом качество трассы, расход
        # батареи и объём хранилища. Проверяется детерминированными сценариями: на живой
        # прогулке не воспроизвести ни ровную прямую, ни точный поворот, ни потерю сигнала.
        run: npm run check:sampling
