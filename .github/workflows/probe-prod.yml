name: probe-prod

# Read-only проба прода: смотрит на живую базу, на регламент и на выход из единого входа,
# ничего не меняет. Заведена по рекомендации brain 2026-09-04 после третьего рецидива
# [G231] в экосистеме и в тот же день расширена до диагностики тихих поломок: регламент
# трасс перестал ходить, кончается запас партиций, в базе появилась строка `dev`,
# сертификат не продлился. Разбор каждой проверки — в deploy/remote-probe.sh.
#
# ⚠️ **Красный прогон здесь — это и есть алертинг проекта** (долг M0.A §3.4: «отказ
# процедуры должен быть громким»; до этого он был громким только в журнале systemd,
# который никто не читает). Письмо о падении присылает GitHub — значит проверка алерта
# сводится к тому, что у владельца включены уведомления о своих Actions.
#
# Раз в сутки и по кнопке. Чаще незачем: сутки — это и порог M0.A §3.4 на отсутствие
# строки аудита, и запас у всех остальных проверок.
#
# Все адреса и пути приходят СЕКРЕТАМИ, не через vars: значения vars печатаются в лог, а
# логи публичного репозитория публичны (AGENTS.md, «recon-поверхность»).

on:
  schedule:
    # 05:17 UTC — не на ровный час: в ровные минуты у GitHub очередь, и запуск съезжает.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-prod
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Список коллекций из конфига
        # Слаги снимаются из сгенерированных типов Payload, а не пишутся руками: это
        # отражение конфига, и второго экземпляра списка в проекте не появляется.
        # Служебные коллекции Payload (`payload-*`) в locked_documents_rels колонок не
        # имеют — они и есть эта служебная механика.
        run: |
          SLUGS=$(node -e '
            const fs = require("node:fs");
            const src = fs.readFileSync("payload-types.ts", "utf8");
            const block = src.match(/\n  collections: \{([\s\S]*?)\n  \};/);
            if (!block) { console.error("не нашёл список коллекций в payload-types.ts"); process.exit(1); }
            const slugs = [...block[1].matchAll(/^\s+'"'"'?([a-zA-Z0-9_-]+)'"'"'?:/gm)]
              .map((m) => m[1])
              .filter((s) => !s.startsWith("payload-"));
            if (!slugs.length) { console.error("список коллекций пуст"); process.exit(1); }
            console.log(slugs.join(","));
          ')
          echo "SLUGS=$SLUGS" >> "$GITHUB_ENV"
          echo "коллекций: $SLUGS"

      - name: Ключ доступа
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTS" > ~/.ssh/known_hosts

      - name: Проба
        env:
          TARGET: ${{ secrets.DEPLOY_TARGET }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          APP_PORT: ${{ secrets.DEPLOY_APP_PORT }}
          SMOKE_URL: ${{ secrets.DEPLOY_SMOKE_URL }}
        # Скрипт уходит файлом на stdin, а не сочиняется здесь строкой (мандат D-046).
        #
        # DEPLOY_SMOKE_URL содержит адреса живых доменов через пробел — тот же секрет, что
        # у смоука: список доменов не должен жить в двух местах. Разбивает их удалённый
        # шелл (G30), в URL пробелов не бывает.
        #
        # ⚠️ stderr клиента ssh заглушён намеренно. Маскировка GitHub срабатывает на ПОЛНОЕ
        # значение секрета, а DEPLOY_TARGET — это `пользователь@хост`; сам же ssh при отказе
        # печатает «connect to host <хост> port <порт>» — то есть хост и порт ОТДЕЛЬНО, и
        # такую строку маскировка не ловит. Логи публичного репозитория публичны, а прогон
        # здесь суточный: без этой строки утечка recon-детали была бы вопросом времени, а не
        # случая (AGENTS.md, D-038). Поэтому вся диагностика пробы идёт в stdout, а сюда
        # попадает только код возврата: 255 — не соединились, иное — сказала сама проба.
        run: |
          set +e
          ssh -p "$SSH_PORT" "$TARGET" bash -s -- "$APP_DIR" "$APP_PORT" "$SLUGS" "$SMOKE_URL" \
            < deploy/remote-probe.sh 2>/dev/null
          rc=$?
          set -e
          if [ "$rc" = "255" ]; then
            echo "ssh не соединился с боксом (код 255); детали в публичный лог не печатаем"
          fi
          exit "$rc"
