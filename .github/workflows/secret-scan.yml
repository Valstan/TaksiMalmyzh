# Secret-scan гейт (мандат brain 2026-08-17). Конфиг — по боевому образцу соседей
# по портфелю (gitleaks-action@v3 + checkout@v5): pull_request-гейт, push в main
# (ловит прямые пуши мимо PR), workflow_dispatch — ручной полный скан всей истории.
name: Secret scan (gitleaks)

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Без полной истории диапазон base^..head не резолвится, а на push
          # сканировался бы один коммит — гейт зелен ровно в том сценарии,
          # ради которого ставится.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE не нужна: personal-аккаунт, не организация.
          # --redact вшит в action — значения находок в лог не попадают.
          # .gitleaks.toml из корня репо gitleaks подхватывает автоматически.
